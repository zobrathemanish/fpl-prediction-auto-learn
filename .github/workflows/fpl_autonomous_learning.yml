name: FPL deadline-aware learning

on:
  schedule:
    # Once per day.
    # 15:00 UTC = 10:00 AM Winnipeg during CDT
    #             9:00 AM Winnipeg during CST.
    #
    # The Python model reads the OFFICIAL FPL deadline itself.
    # It refreshes the upcoming snapshot only while the deadline is ahead,
    # freezes it after the deadline, and learns completed Gameweeks.
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-fpl-model:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn requests openpyxl xlsxwriter pulp

      - name: Run deadline-aware FPL model
        run: |
          python fpl_model_v14_deadline_aware.py

      - name: Persist snapshots and learned state
        run: |
          git config user.name "fpl-learning-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add fpl_snapshots/ || true
          git add fpl_gameweek_weight_history.csv || true
          git add fpl_automation_state.csv || true
          git add fpl_model_output_v14_deadline_aware.xlsx || true

          if git diff --cached --quiet; then
            echo "No model-state changes to commit."
          else
            git commit -m "Update FPL snapshot and learned state"
            git push
          fi
